name: Run single-cell analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run analysis
        run: python -m src.analyze
      - name: Save full analysis as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbmc3k-full-analysis
          path: results/
          retention-days: 30
      - name: Commit figures and results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/summary.json results/figures/*.png results/cluster_marker_candidates.csv results/cell_clusters.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add PBMC single-cell analysis outputs"
            git push
          fi
